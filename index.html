<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Nexus - Acesso</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Share Tech Mono', monospace;
            background: #050508;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        canvas#matrix { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.12; }
        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
            pointer-events: none; z-index: 10;
        }
        .container {
            position: relative; z-index: 5;
            background: rgba(10, 10, 15, 0.92);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 2px;
            padding: 48px 40px;
            max-width: 520px; width: 92%;
            text-align: center;
            box-shadow: 0 0 60px rgba(168, 85, 247, 0.08), inset 0 0 60px rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
        }
        .container::before {
            content: ''; position: absolute; top: -1px; left: 20%; right: 20%; height: 1px;
            background: linear-gradient(90deg, transparent, #a855f7, transparent);
        }
        .container::after {
            content: ''; position: absolute; bottom: -1px; left: 20%; right: 20%; height: 1px;
            background: linear-gradient(90deg, transparent, #a855f7, transparent);
        }
        .corner { position: absolute; width: 16px; height: 16px; border-color: #a855f7; border-style: solid; border-width: 0; }
        .corner.tl { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
        .corner.tr { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
        .corner.bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
        .corner.br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }
        .logo-wrap { position: relative; margin: 0 auto 28px; width: 90px; height: 90px; }
        .logo-ring {
            position: absolute; top: 0; left: 0; width: 90px; height: 90px;
            border: 2px solid rgba(168, 85, 247, 0.3);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }
        .logo-ring2 {
            position: absolute; top: 6px; left: 6px; width: 78px; height: 78px;
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-bottom-color: rgba(168, 85, 247, 0.5);
            border-radius: 50%;
            animation: spin 3s linear infinite reverse;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .logo {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #a855f7, #6d28d9);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 26px; font-weight: 900; color: #fff;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }
        .status-bar {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-bottom: 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 2px;
            color: #22c55e;
        }
        .status-dot {
            width: 6px; height: 6px; background: #22c55e; border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5s ease infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px; font-weight: 700;
            background: linear-gradient(135deg, #a855f7, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 6px; letter-spacing: 1px;
        }
        .subtitle { font-size: 12px; color: #555; margin-bottom: 32px; letter-spacing: 3px; text-transform: uppercase; }
        .divider {
            height: 1px; margin: 0 0 28px;
            background: linear-gradient(90deg, transparent, rgba(168,85,247,0.2), transparent);
        }
        .key-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(168, 85, 247, 0.15);
            padding: 24px 20px;
            margin-bottom: 28px;
            position: relative;
        }
        .key-box::before {
            content: '[ ]'; position: absolute; top: -8px; left: 16px;
            background: #0a0a0f; padding: 0 8px;
            font-size: 10px; color: #a855f7; letter-spacing: 2px;
        }
        .key-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 3px;
            color: #555; margin-bottom: 14px;
        }
        .key-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px; font-weight: 700;
            color: #a855f7;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            user-select: all;
        }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: transparent;
            color: #a855f7;
            border: 1px solid #a855f7;
            padding: 14px 36px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }
        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(168,85,247,0.1), transparent);
            transition: left 0.5s ease;
        }
        .btn:hover::before { left: 100%; }
        .btn:hover {
            background: rgba(168, 85, 247, 0.1);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2), inset 0 0 20px rgba(168, 85, 247, 0.05);
        }
        .btn.copied { border-color: #22c55e; color: #22c55e; }
        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            margin-top: 28px; text-align: left;
        }
        .info-item {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(168,85,247,0.08);
            padding: 12px 14px;
        }
        .info-label { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: #444; margin-bottom: 4px; }
        .info-val { font-size: 12px; color: #a855f7; }
        .yt-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255, 0, 0, 0.08);
            color: #ff4444;
            border: 1px solid rgba(255, 0, 0, 0.25);
            padding: 12px 28px;
            margin-top: 24px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .yt-btn:hover {
            background: rgba(255, 0, 0, 0.15);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.15);
        }
        .yt-btn svg { width: 16px; height: 16px; fill: #ff4444; }
        .footer {
            margin-top: 28px; padding-top: 16px;
            border-top: 1px solid rgba(168,85,247,0.08);
            font-size: 10px; color: #333; letter-spacing: 2px; text-transform: uppercase;
        }
        .glitch { animation: glitch 4s infinite; }
        @keyframes glitch {
            0%, 95%, 100% { opacity: 1; transform: none; }
            96% { opacity: 0.8; transform: translateX(-2px); }
            97% { opacity: 0.8; transform: translateX(2px); }
            98% { opacity: 0.9; transform: translateX(-1px); }
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="scanline"></div>

    <div class="container glitch">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="logo-wrap">
            <div class="logo-ring"></div>
            <div class="logo-ring2"></div>
            <div class="logo">N</div>
        </div>

        <div class="status-bar">
            <div class="status-dot"></div>
            <span>SYSTEM ONLINE</span>
        </div>

        <h1>PAINEL NEXUS</h1>
        <div class="subtitle">Free Fire VPN &bull; v2.0</div>

        <div class="divider"></div>

        <div class="key-box">
            <div class="key-label">Access Key</div>
            <div class="key-value" id="key">Painel Nexus</div>
        </div>

        <button class="btn" id="copyBtn" onclick="copyKey()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            <span id="btnText">Copiar Key</span>
        </button>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">Status</div>
                <div class="info-val">ATIVO</div>
            </div>
            <div class="info-item">
                <div class="info-label">Validade</div>
                <div class="info-val">PERMANENTE</div>
            </div>
            <div class="info-item">
                <div class="info-label">Plataforma</div>
                <div class="info-val">Android</div>
            </div>
            <div class="info-item">
                <div class="info-label">Versao</div>
                <div class="info-val">2.0</div>
            </div>
        </div>

        <a href="https://www.youtube.com/@JulioXIT-777" target="_blank" class="yt-btn">
            <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            Canal YouTube
        </a>

        <div class="footer">Painel Nexus &copy; 2026</div>
    </div>

    <script>
        // Matrix rain
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*paiNELxus'.split('');
        const fontSize = 14;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#a855f7';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 45);
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

        // Copy
        function copyKey() {
            navigator.clipboard.writeText('Painel Nexus').then(() => {
                const btn = document.getElementById('copyBtn');
                const txt = document.getElementById('btnText');
                btn.classList.add('copied');
                txt.textContent = 'Copiado!';
                setTimeout(() => { btn.classList.remove('copied'); txt.textContent = 'Copiar Key'; }, 2000);
            });
        }
    </script>
</body>
</html>
